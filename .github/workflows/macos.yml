# The macOS jobs, apart from CI: the org's macOS runners can take long to start, and a
# job that waits too long is cancelled; here that does not mark CI failed.
name: macOS
on:
  # once per change: main (main and the tags only get commits that already ran here)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: eskiuc test
      - name: JVM
        run: tests/jvm/check.sh
      - name: Example
        run: |
          mkdir -p build/hello
          eskiuc examples/hello/hello.esk -o build/hello/libhello.dylib
          javac -d build/hello examples/hello/com/example/hello/Greeter.java
          java -Djava.library.path=build/hello -cp build/hello com.example.hello.Greeter Eskiu | tee build/hello.txt
          grep -q "Hello, Eskiu, from Eskiu" build/hello.txt
